<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ビンゴ ビューアー</title>
<style>
:root {
  color-scheme: light dark;
  font-family: system-ui, sans-serif;
  --bg: light-dark(#fff, #111);
  --surface: light-dark(#f4f5f7, #202124);
  --text: light-dark(#171717, #f5f5f5);
  --border: light-dark(#dedfe3, #414248);
  --accent: light-dark(#242424, #f0f0f0);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  padding: 16px;
}
main { width: min(100%, 1200px); margin: 0 auto; }
header { margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
h1 { margin: 0; font-size: 1.4rem; }

.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 20px;
}
.panel-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 10px;
}
.panel h3 { margin: 0; font-size: 0.95rem; }
.search-box {
  display: flex;
  gap: 6px;
  align-items: center;
}
.search-box input, .search-box select {
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  color: inherit;
  font: inherit;
  font-size: 0.9rem;
}
.search-box button {
  padding: 6px 12px;
  border: none;
  border-radius: 8px;
  background: var(--accent);
  color: light-dark(#fff, #151515);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
}
#markedNumbersList {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  max-height: 120px;
  overflow-y: auto;
}
.marked-chip {
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 4px 8px;
  border-radius: 6px;
  font-size: 0.85rem;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
  transition: background 0.15s;
}
.marked-chip:hover { background: var(--border); }
.marked-chip.active { background: #8b2525; color: #fff; border-color: #8b2525; }
/* 破られた数字リスト内で未選出（不正）の数字を赤く表示 */
.marked-chip.cheated { background: #8b2525 !important; color: #fff !important; border-color: #ff4d4d !important; }

.ranking-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 250px;
  overflow-y: auto;
}
.ranking-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 0.9rem;
}
.ranking-info {
  display: flex;
  gap: 12px;
  align-items: center;
}
.rank-badge { font-weight: 700; min-width: 24px; }

.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 16px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px;
  cursor: pointer;
  transition: transform .15s ease, opacity .15s ease;
}
.card:hover { transform: translateY(-2px); opacity: .9; }
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  font-size: 0.9rem;
  font-weight: 600;
}
.bingo-badge {
  background: #8b2525;
  color: #fff;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 0.8rem;
}

.mini-board { display: grid; gap: 3px; }
.mini-cell {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: clamp(0.5rem, 1.5vw, 0.75rem);
}
.mini-cell.free { font-size: 0.5rem; font-weight: bold; background: var(--border); }
.mini-cell.marked { background: light-dark(#e7e7e7, #343434); color: light-dark(#666, #bbb); text-decoration: line-through; }
.mini-cell.cheated { background: #8b2525 !important; color: #fff !important; border-color: #ff4d4d !important; text-decoration: line-through; }

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 1000;
}
.modal[hidden] { display: none; }
.modal-content {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  width: min(100%, 600px);
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.close-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 12px;
  cursor: pointer;
  font-weight: 600;
}
.full-board { display: grid; gap: 5px; }
.full-cell {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  font-size: clamp(0.8rem, 2.5vw, 1.2rem);
}
.full-cell.free { background: var(--surface); font-size: 0.75rem; font-weight: 700; }
.full-cell.marked { background: light-dark(#e7e7e7, #343434); color: light-dark(#666, #bbb); border-style: dashed; }
.full-cell.marked span { text-decoration: line-through; }
.full-cell.cheated { background: #8b2525 !important; color: #fff !important; border-color: #ff4d4d !important; }

#status { font-size: 0.85rem; color: #888; }
</style>
</head>
<body>
<main>
<header>
  <h1>ビンゴ ビューアー</h1>
  <span id="status">読み込み中...</span>
</header>

<section class="panel">
  <div class="panel-top">
    <h3>破られている数字（タップでその数字を持つIDを検索）</h3>
    <div class="search-box">
      <input type="number" id="searchInput" placeholder="数字を入力" min="0">
      <button id="searchBtn" type="button">検索</button>
      <button id="clearSearchBtn" type="button" style="background:var(--surface); border:1px solid var(--border);">解除</button>
    </div>
  </div>
  <div id="markedNumbersList">
    <span style="color: #888; font-size: 0.85rem;">データがありません</span>
  </div>
</section>

<section class="panel">
  <div class="panel-top">
    <h3>ビンゴ ランキング</h3>
    <div class="search-box">
      <label for="rankingMode" style="font-size:0.85rem; font-weight:600;">モード:</label>
      <select id="rankingMode">
        <option value="count">ビンゴ数順</option>
        <option value="speed">指定ビンゴ達成早い順</option>
      </select>
      <select id="targetBingoNum" style="display:none;">
        <option value="1">1 ビンゴ</option>
        <option value="2">2 ビンゴ</option>
        <option value="3">3 ビンゴ</option>
        <option value="4">4 ビンゴ</option>
        <option value="5">5 ビンゴ</option>
      </select>
    </div>
  </div>
  <div id="rankingList" class="ranking-list">
    <span style="color: #888; font-size: 0.85rem;">データがありません</span>
  </div>
</section>

<section id="cardsGrid" class="cards-grid"></section>
</main>

<div id="modal" class="modal" hidden>
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modalTitle" style="margin:0; font-size: 1.2rem;"></h2>
      <button id="closeModal" class="close-btn" type="button">閉じる</button>
    </div>
    <div id="modalBoard" class="full-board"></div>
  </div>
</div>

<script>
'use strict';

const statusEl = document.getElementById('status');
const cardsGrid = document.getElementById('cardsGrid');
const markedNumbersList = document.getElementById('markedNumbersList');
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const clearSearchBtn = document.getElementById('clearSearchBtn');

const rankingMode = document.getElementById('rankingMode');
const targetBingoNum = document.getElementById('targetBingoNum');
const rankingList = document.getElementById('rankingList');

const modal = document.getElementById('modal');
const closeModalBtn = document.getElementById('closeModal');
const modalTitle = document.getElementById('modalTitle');
const modalBoard = document.getElementById('modalBoard');

let allData = {};
let officialDrawnSet = new Set();
let lotteryHistoryMap = {};
let currentModalId = null;
let selectedSearchNumber = null;

// インデックスから数値を厳密に算出（一番最後のマスを含むすべての境界値を正しく処理）
function getNumberFromIndex(n, values, index) {
  const hasFree = n % 2 === 1;
  const freeIndex = hasFree ? Math.floor((n * n) / 2) : -1;
  if (index === freeIndex) return 'FREE';
  const valIndex = (freeIndex !== -1 && index > freeIndex) ? index - 1 : index;
  return values[valIndex];
}

function analyzeBingoProgress(side, marked, values, hasFree) {
  const n = side;
  const freeIndex = hasFree ? Math.floor((n * n) / 2) : -1;

  const lines = [];
  for (let r = 0; r < n; r++) {
    const line = [];
    for (let c = 0; c < n; c++) line.push(r * n + c);
    lines.push(line);
  }
  for (let c = 0; c < n; c++) {
    const line = [];
    for (let r = 0; r < n; r++) line.push(r * n + c);
    lines.push(line);
  }
  const diag1 = [];
  for (let i = 0; i < n; i++) diag1.push(i * n + i);
  lines.push(diag1);

  const diag2 = [];
  for (let i = 0; i < n; i++) diag2.push(i * n + (n - 1 - i));
  lines.push(diag2);

  const achievedAtTime = {};
  const currentMarked = new Set();
  if (freeIndex !== -1) currentMarked.add(freeIndex);

  let currentBingoCount = 0;
  const markedList = Array.isArray(marked) ? marked : [];

  for (let step = 0; step < markedList.length; step++) {
    const idx = markedList[step];
    currentMarked.add(idx);

    const num = getNumberFromIndex(n, values, idx);
    const drawTime = lotteryHistoryMap[num] || null;

    let newCount = 0;
    lines.forEach(line => {
      if (line.every(i => currentMarked.has(i))) newCount++;
    });

    for (let b = currentBingoCount + 1; b <= newCount; b++) {
      if (!achievedAtTime[b]) {
        achievedAtTime[b] = drawTime;
      }
    }
    currentBingoCount = newCount;
  }

  return { bingoCount: currentBingoCount, achievedAtTime };
}

async function fetchAllData() {
  try {
    const [resCards, resLottery] = await Promise.all([
      fetch('/api/get_all'),
      fetch('/api/lottery/get')
    ]);

    if (!resCards.ok) throw new Error('Failed to fetch cards');
    allData = await resCards.json();

    if (resLottery.ok) {
      const lotteryData = await resLottery.json();
      officialDrawnSet.clear();
      lotteryHistoryMap = {};
      if (Array.isArray(lotteryData.drawnHistory)) {
        lotteryData.drawnHistory.forEach(item => {
          officialDrawnSet.add(Number(item.num));
          officialDrawnSet.add(String(item.num));
          lotteryHistoryMap[item.num] = item.time;
        });
      }
    }

    renderAll();
    statusEl.textContent = `最終更新: ${new Date().toLocaleTimeString()} (自動更新中)`;
  } catch (err) {
    statusEl.textContent = 'データ取得エラー';
  }
}

function renderAll() {
  cardsGrid.replaceChildren();
  rankingList.replaceChildren();

  const ids = Object.keys(allData).map(Number).sort((a, b) => a - b);
  
  if (ids.length === 0) {
    cardsGrid.innerHTML = '<p style="color:#888; grid-column: 1/-1;">有効なビンゴデータがありません。</p>';
    markedNumbersList.innerHTML = '<span style="color: #888; font-size: 0.85rem;">データがありません</span>';
    rankingList.innerHTML = '<span style="color: #888; font-size: 0.85rem;">データがありません</span>';
    return;
  }

  const globalMarkedSet = new Set();
  const cardStats = [];

  ids.forEach(id => {
    const data = allData[id];
    if (!data) return;

    const { side: n, values, marked } = data;
    const hasFree = n % 2 === 1;
    const cardMarkedNumbers = new Set();

    if (Array.isArray(marked)) {
      marked.forEach(idx => {
        const num = getNumberFromIndex(n, values, idx);
        if (num !== undefined && num !== 'FREE') {
          globalMarkedSet.add(Number(num));
          cardMarkedNumbers.add(Number(num));
        }
      });
    }

    const progress = analyzeBingoProgress(n, marked, values, hasFree);

    cardStats.push({
      id,
      n,
      values,
      marked,
      hasFree,
      bingoCount: progress.bingoCount,
      achievedAtTime: progress.achievedAtTime,
      cardMarkedNumbers
    });
  });

  const mode = rankingMode.value;
  const targetB = Number.parseInt(targetBingoNum.value, 10);

  let sortedRanking = [...cardStats];

  if (mode === 'count') {
    sortedRanking.sort((a, b) => b.bingoCount - a.bingoCount);
  } else if (mode === 'speed') {
    sortedRanking.sort((a, b) => {
      const timeA = a.achievedAtTime[targetB];
      const timeB = b.achievedAtTime[targetB];
      if (timeA && timeB) return timeA.localeCompare(timeB);
      if (timeA) return -1;
      if (timeB) return 1;
      return b.bingoCount - a.bingoCount;
    });
  }

  if (sortedRanking.length === 0) {
    rankingList.innerHTML = '<span style="color: #888; font-size: 0.85rem;">ランキングデータがありません</span>';
  } else {
    sortedRanking.forEach((stat, index) => {
      const item = document.createElement('div');
      item.className = 'ranking-item';

      let detailText = `ビンゴ数: ${stat.bingoCount}`;
      if (mode === 'speed') {
        const t = stat.achievedAtTime[targetB];
        detailText = t ? `${targetB}ビンゴ達成 (時刻: ${t})` : `${targetB}ビンゴ未達成`;
      }

      item.innerHTML = `
        <div class="ranking-info">
          <span class="rank-badge">${index + 1}位</span>
          <span><strong>ID: ${stat.id}</strong> (${stat.n}×${stat.n})</span>
        </div>
        <span style="font-size:0.85rem; color:#888;">${detailText}</span>
      `;
      rankingList.appendChild(item);
    });
  }

  let displayedCards = cardStats;
  if (selectedSearchNumber !== null) {
    displayedCards = cardStats.filter(stat => stat.cardMarkedNumbers.has(selectedSearchNumber));
  }

  if (displayedCards.length === 0) {
    cardsGrid.innerHTML = `<p style="color:#888; grid-column: 1/-1;">数字「${selectedSearchNumber}」が破られているカードは見つかりませんでした。</p>`;
  } else {
    displayedCards.forEach(stat => {
      const card = document.createElement('div');
      card.className = 'card';
      card.addEventListener('click', () => openModal(stat.id));

      const cardHeader = document.createElement('div');
      cardHeader.className = 'card-header';
      cardHeader.innerHTML = `
        <span>ID: ${stat.id} (${stat.n}×${stat.n})</span>
        <span class="bingo-badge">ビンゴ: ${stat.bingoCount}</span>
      `;
      card.appendChild(cardHeader);

      const miniBoard = document.createElement('div');
      miniBoard.className = 'mini-board';
      miniBoard.style.gridTemplateColumns = `repeat(${stat.n}, minmax(0, 1fr))`;

      let valueIndex = 0;
      for (let i = 0; i < stat.n * stat.n; i++) {
        const isFree = stat.hasFree && i === Math.floor((stat.n * stat.n) / 2);
        const miniCell = document.createElement('div');
        miniCell.className = 'mini-cell' + (isFree ? ' free' : '');

        if (isFree) {
          miniCell.textContent = 'F';
        } else {
          const val = stat.values[valueIndex++];
          miniCell.textContent = val;
          const isMarked = Array.isArray(stat.marked) && stat.marked.includes(i);
          if (isMarked) {
            miniCell.classList.add('marked');
            if (!officialDrawnSet.has(val) && !officialDrawnSet.has(String(val))) {
              miniCell.classList.add('cheated');
            }
          }
        }
        miniBoard.appendChild(miniCell);
      }
      card.appendChild(miniBoard);
      cardsGrid.appendChild(card);
    });
  }

  // 破られた数字のチップ一覧生成（未選出数字は cheated クラスで赤色表示）
  markedNumbersList.replaceChildren();
  if (globalMarkedSet.size === 0) {
    markedNumbersList.innerHTML = '<span style="color: #888; font-size: 0.85rem;">まだ破られた数字はありません</span>';
  } else {
    const sortedNums = Array.from(globalMarkedSet).sort((a, b) => a - b);
    sortedNums.forEach(num => {
      const chip = document.createElement('span');
      let chipClass = 'marked-chip';
      if (selectedSearchNumber === num) chipClass += ' active';
      
      // まだ抽選されていない数字であれば赤色表示にする
      if (!officialDrawnSet.has(num) && !officialDrawnSet.has(String(num))) {
        chipClass += ' cheated';
      }

      chip.className = chipClass;
      chip.textContent = num;
      chip.addEventListener('click', () => {
        if (selectedSearchNumber === num) clearSearch();
        else {
          selectedSearchNumber = num;
          searchInput.value = num;
          renderAll();
        }
      });
      markedNumbersList.appendChild(chip);
    });
  }

  if (currentModalId !== null && allData[currentModalId]) {
    updateModalContent(allData[currentModalId]);
  }
}

rankingMode.addEventListener('change', () => {
  targetBingoNum.style.display = rankingMode.value === 'speed' ? 'inline-block' : 'none';
  renderAll();
});
targetBingoNum.addEventListener('change', renderAll);

function executeSearch() {
  const val = searchInput.value.trim();
  if (val === '') { clearSearch(); return; }
  selectedSearchNumber = Number.parseInt(val, 10);
  renderAll();
}

function clearSearch() {
  selectedSearchNumber = null;
  searchInput.value = '';
  renderAll();
}

searchBtn.addEventListener('click', executeSearch);
clearSearchBtn.addEventListener('click', clearSearch);
searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') executeSearch(); });

function openModal(id) {
  currentModalId = id;
  const data = allData[id];
  if (!data) return;
  modalTitle.textContent = `ID: ${id} の詳細`;
  updateModalContent(data);
  modal.hidden = false;
}

function updateModalContent(data) {
  const { side: n, values, marked } = data;
  modalBoard.replaceChildren();
  modalBoard.style.gridTemplateColumns = `repeat(${n}, minmax(0, 1fr))`;

  const hasFree = n % 2 === 1;
  let valueIndex = 0;

  for (let i = 0; i < n * n; i++) {
    const isFree = hasFree && i === Math.floor((n * n) / 2);
    const cell = document.createElement('div');
    cell.className = 'full-cell' + (isFree ? ' free' : '');

    if (isFree) {
      cell.innerHTML = '<span>FREE</span>';
    } else {
      const val = values[valueIndex++];
      cell.innerHTML = `<span>${val}</span>`;
      const isMarked = Array.isArray(marked) && marked.includes(i);
      if (isMarked) {
        cell.classList.add('marked');
        if (!officialDrawnSet.has(val) && !officialDrawnSet.has(String(val))) {
          cell.classList.add('cheated');
        }
      }
    }
    modalBoard.appendChild(cell);
  }
}

closeModalBtn.addEventListener('click', () => { modal.hidden = true; currentModalId = null; });
modal.addEventListener('click', (e) => { if (e.target === modal) { modal.hidden = true; currentModalId = null; } });

fetchAllData();
setInterval(fetchAllData, 2000);
</script>
</body>
</html>
