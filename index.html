<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ビンゴシート</title>
<style>
:root {
  color-scheme: light dark;
  font-family: system-ui, sans-serif;
  --bg: light-dark(#fff, #111);
  --surface: light-dark(#f4f5f7, #202124);
  --text: light-dark(#171717, #f5f5f5);
  --border: light-dark(#dedfe3, #414248);
  --accent: light-dark(#242424, #f0f0f0);
  --accent-text: light-dark(#fff, #151515);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
}
button, input, select { font: inherit; }
#app { min-height: 100vh; padding: 16px; display: flex; flex-direction: column; }
main { width: min(100%, 800px); margin: 0 auto; flex: 1; display: flex; flex-direction: column; }
header { margin-bottom: 20px; }
h1 {
  margin: 0;
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -.03em;
}

.screen[hidden] { display: none !important; }

#setup.screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 20px;
  padding-bottom: 40px;
}
#setup .controls {
  justify-content: center;
}
#setup .action-row {
  justify-content: center;
  width: 100%;
}
#setup button {
  width: min(100%, 200px);
}

.controls {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}
label {
  font-size: .9rem;
  font-weight: 600;
}
input, select {
  min-height: 42px;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface);
  color: inherit;
}
input[type=number] { width: 88px; }
button {
  min-height: 42px;
  cursor: pointer;
  border: 1px solid transparent;
  border-radius: 12px;
  padding: 10px 16px;
  background: var(--surface);
  color: inherit;
  font-weight: 600;
  transition:
    background .15s ease,
    transform .15s ease,
    opacity .15s ease;
}
button:hover { opacity: .82; }
button:active { transform: scale(.97); }
button:focus-visible,
input:focus-visible,
select:focus-visible {
  outline: 3px solid light-dark(#999, #aaa);
  outline-offset: 3px;
}
#generate {
  background: var(--accent);
  color: var(--accent-text);
}
.action-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.board-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
  font-size: .9rem;
}
#counter {
  padding: 5px 10px;
  border-radius: 999px;
  background: var(--surface);
  font-variant-numeric: tabular-nums;
}
#board {
  display: grid;
  gap: 5px;
}
.cell {
  position: relative;
  aspect-ratio: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  color: inherit;
  font-size: clamp(.7rem, 2.5vw, 1.3rem);
  font-weight: 500;
}
.cell:hover { background: var(--surface); opacity: 1; }
.cell.free {
  background: var(--surface);
  font-size: .75rem;
  font-weight: 700;
}
.cell.marked {
  animation: tear .25s ease-out forwards;
  background: light-dark(#e7e7e7, #343434);
  color: light-dark(#666, #bbb);
  border-style: dashed;
}
.cell.marked span { text-decoration: line-through; }
@keyframes tear {
  0% { transform: scale(1); }
  100% {
    transform: rotate(1deg) scale(.95);
    clip-path: polygon(2% 0, 100% 5%, 94% 100%, 0 92%);
  }
}
#reset { border-color: var(--border); }
#reset.confirming {
  background: #8b2525;
  color: #fff;
  border-color: #8b2525;
}
#reset-hint {
  min-height: 1.5em;
  margin: -8px 0 12px;
  font-size: .85rem;
  color: light-dark(#666, #aaa);
}
@media(max-width:600px) {
  #app { padding: 12px; }
  header { margin-bottom: 16px; }
  .controls { gap: 8px; }
  #board { gap: 3px; }
  .cell { border-radius: 5px; }
  .cell.free { font-size: .65rem; }
}
@media(prefers-reduced-motion:reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>
<body>
<div id="app">
<main>
<header>
  <h1>ビンゴ</h1>
</header>

<!-- 作成画面 -->
<section id="setup" class="screen" aria-label="作成画面">
  <section class="controls" aria-label="シート設定">
    <div style="display: flex; gap: 15px; flex-wrap: wrap; justify-content: center;">
      <div>
        <label for="sheetId">ID (2桁)</label><br>
        <input
          id="sheetId"
          type="number"
          min="10"
          max="99"
          step="1"
          value="10"
          aria-label="ID"
        >
      </div>
      <div>
        <label for="side">サイズ (4〜20)</label><br>
        <input
          id="side"
          type="number"
          min="4"
          max="20"
          step="1"
          value="4"
          aria-label="サイズ"
        >
      </div>
    </div>
  </section>

  <div class="action-row">
    <button id="generate" type="button">作成</button>
  </div>
</section>

<!-- ビンゴ画面 -->
<section id="game" class="screen" hidden aria-label="ビンゴ画面">
  <section class="board-wrap" aria-label="ビンゴシート">
    <div class="board-top">
      <strong id="boardTitle">4 × 4</strong>
      <span id="counter" aria-live="polite">0</span>
    </div>
    <div id="board" role="group" aria-label="ビンゴのマス"></div>
  </section>

  <div class="action-row" style="margin-top:16px">
    <button id="reset" type="button">リセット</button>
  </div>
  <p id="reset-hint" aria-live="polite"></p>
</section>
</main>
</div>

<script>
'use strict';

const sheetIdInput = document.getElementById('sheetId');
const sideInput = document.getElementById('side');
const board = document.getElementById('board');
const counter = document.getElementById('counter');
const boardTitle = document.getElementById('boardTitle');
const setupScreen = document.getElementById('setup');
const gameScreen = document.getElementById('game');
const resetButton = document.getElementById('reset');
const resetHint = document.getElementById('reset-hint');

let currentState = null;
let resetClicks = 0;
const RESET_REQUIRED = 3;
const STORAGE_KEY = 'bingo_sheet_state_v2';

function shuffled(values) {
  for (let i = values.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [values[i], values[j]] = [values[j], values[i]];
  }
  return values;
}

function saveState() {
  if (!currentState) return;
  const jsonStr = JSON.stringify(currentState);

  try {
    localStorage.setItem(STORAGE_KEY, jsonStr);
  } catch (e) {
    console.error('LocalStorage save failed:', e);
  }

  if (currentState.id) {
    fetch(`/api/upload?id=${currentState.id}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: jsonStr
    }).catch(err => {
      console.error('API upload failed:', err);
    });
  }
}

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    return saved ? JSON.parse(saved) : null;
  } catch (e) {
    console.error('LocalStorage load failed:', e);
    return null;
  }
}

function clearState() {
  if (currentState && currentState.id) {
    fetch(`/api/delete?id=${currentState.id}`, {
      method: 'DELETE'
    }).catch(err => {
      console.error('API delete failed:', err);
    });
  }

  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (e) {}
}

function updateCounter() {
  counter.textContent = String(
    board.querySelectorAll('.cell.marked').length
  );
}

function renderBoard() {
  if (!currentState) return;

  const { id, side: n, values, marked } = currentState;

  if (sheetIdInput) sheetIdInput.value = id;
  sideInput.value = n;
  board.replaceChildren();
  board.style.gridTemplateColumns = `repeat(${n}, minmax(0, 1fr))`;
  boardTitle.textContent = `${n} × ${n} (ID: ${id})`;

  const hasFree = n % 2 === 1;
  let valueIndex = 0;

  for (let i = 0; i < n * n; i++) {
    const isFree = hasFree && i === Math.floor((n * n) / 2);

    const cell = document.createElement('button');
    cell.type = 'button';
    cell.className = 'cell' + (isFree ? ' free' : '');
    cell.setAttribute('aria-pressed', 'false');

    if (isFree) {
      const span = document.createElement('span');
      span.textContent = 'FREE';
      cell.appendChild(span);
      cell.setAttribute('aria-label', 'FREE マス');
      cell.disabled = true;
    } else {
      const value = values[valueIndex++];
      const span = document.createElement('span');
      span.textContent = String(value);
      cell.appendChild(span);

      const isMarked = Array.isArray(marked) && marked.includes(i);
      if (isMarked) {
        cell.classList.add('marked');
        cell.setAttribute('aria-pressed', 'true');
      }

      cell.setAttribute(
        'aria-label',
        `番号 ${value}。${isMarked ? '破り済み。タップして戻す' : 'タップして破る'}`
      );

      cell.addEventListener('click', () => {
        const isNowMarked = cell.classList.toggle('marked');

        cell.setAttribute('aria-pressed', String(isNowMarked));
        cell.setAttribute(
          'aria-label',
          `番号 ${value}。${
            isNowMarked
              ? '破り済み。タップして戻す'
              : 'タップして破る'
          }`
        );

        if (!Array.isArray(currentState.marked)) {
          currentState.marked = [];
        }

        if (isNowMarked) {
          if (!currentState.marked.includes(i)) {
            currentState.marked.push(i);
          }
        } else {
          currentState.marked = currentState.marked.filter(index => index !== i);
        }

        updateCounter();
        saveState();
      });
    }

    board.appendChild(cell);
  }

  updateCounter();

  resetClicks = 0;
  updateResetButton();

  setupScreen.hidden = true;
  gameScreen.hidden = false;
}

// サーバーから全体の最大サイズを取得して、抽選と同じロジックで数字範囲を決定して作成
async function buildBoard() {
  let idVal = Number.parseInt(sheetIdInput.value, 10);
  if (!Number.isFinite(idVal)) idVal = 10;
  idVal = Math.max(10, Math.min(99, Math.floor(idVal)));
  sheetIdInput.value = idVal;

  let n = Number.parseInt(sideInput.value, 10);
  if (!Number.isFinite(n)) n = 4;
  n = Math.max(4, Math.min(20, Math.floor(n)));
  sideInput.value = n;

  // サーバー上の全ボードから最大サイズを取得するか、現在の設定サイズを基準にする
  let maxSide = n;
  try {
    const res = await fetch('/api/get_all');
    if (res.ok) {
      const allData = await res.json();
      Object.keys(allData).forEach(id => {
        const sheet = allData[id];
        if (sheet && sheet.side > maxSide) {
          maxSide = sheet.side;
        }
      });
    }
  } catch (e) {}

  // 抽選画面と同様に「最大のサイズの総マスの3倍」を数値プールの最大値とする
  const maxNumber = maxSide * maxSide * 3;

  const hasFree = n % 2 === 1;
  const total = n * n - (hasFree ? 1 : 0);

  const numbers = Array.from(
    { length: maxNumber + 1 },
    (_, i) => i
  );

  shuffled(numbers);
  const values = numbers.slice(0, total);

  currentState = {
    id: idVal,
    side: n,
    values,
    marked: []
  };

  saveState();
  renderBoard();
}

function updateResetButton() {
  const remaining = RESET_REQUIRED - resetClicks;

  if (resetClicks === 0) {
    resetButton.textContent = 'リセット';
    resetHint.textContent = '';
    resetButton.classList.remove('confirming');
  } else {
    resetButton.textContent =
      `リセット（${resetClicks}/${RESET_REQUIRED}）`;
    resetHint.textContent =
      `初期画面に戻るまで、あと${remaining}回押してください。`;
    resetButton.classList.add('confirming');
  }
}

function handleReset() {
  resetClicks++;

  if (resetClicks < RESET_REQUIRED) {
    updateResetButton();
    return;
  }

  clearState();
  board.replaceChildren();
  board.style.gridTemplateColumns = '';
  counter.textContent = '0';
  boardTitle.textContent = '4 × 4';
  currentState = null;
  resetClicks = 0;

  resetButton.textContent = 'リセット';
  resetButton.classList.remove('confirming');
  resetHint.textContent = '';

  gameScreen.hidden = true;
  setupScreen.hidden = false;
}

document.getElementById('generate').addEventListener('click', buildBoard);
resetButton.addEventListener('click', handleReset);

function init() {
  const savedState = loadState();
  if (savedState) {
    currentState = savedState;
    renderBoard();
  } else {
    setupScreen.hidden = false;
    gameScreen.hidden = true;
  }
}

init();
</script>
</body>
</html>
