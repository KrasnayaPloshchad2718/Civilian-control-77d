<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ビンゴ ビューアー</title>
<style>
:root {
  color-scheme: light dark;
  font-family: system-ui, sans-serif;
  --bg: light-dark(#fff, #111);
  --surface: light-dark(#f4f5f7, #202124);
  --text: light-dark(#171717, #f5f5f5);
  --border: light-dark(#dedfe3, #414248);
  --accent: light-dark(#242424, #f0f0f0);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  padding: 16px;
}
main { width: min(100%, 1200px); margin: 0 auto; }
header { margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
h1 { margin: 0; font-size: 1.4rem; }

/* 破られた数字の一覧・検索パネル */
.global-marked-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 20px;
}
.panel-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 10px;
}
.global-marked-panel h3 {
  margin: 0;
  font-size: 0.95rem;
}
.search-box {
  display: flex;
  gap: 6px;
  align-items: center;
}
.search-box input {
  width: 110px;
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  color: inherit;
  font: inherit;
  font-size: 0.9rem;
}
.search-box button {
  padding: 6px 12px;
  border: none;
  border-radius: 8px;
  background: var(--accent);
  color: light-dark(#fff, #151515);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
}
#markedNumbersList {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  max-height: 120px;
  overflow-y: auto;
}
.marked-chip {
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 4px 8px;
  border-radius: 6px;
  font-size: 0.85rem;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
  transition: background 0.15s;
}
.marked-chip:hover {
  background: var(--border);
}
.marked-chip.active {
  background: #8b2525;
  color: #fff;
  border-color: #8b2525;
}

/* カードグリッド */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 16px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px;
  cursor: pointer;
  transition: transform .15s ease, opacity .15s ease;
}
.card:hover { transform: translateY(-2px); opacity: .9; }
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  font-size: 0.9rem;
  font-weight: 600;
}
.bingo-badge {
  background: #8b2525;
  color: #fff;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 0.8rem;
}

/* ミニボード */
.mini-board {
  display: grid;
  gap: 3px;
}
.mini-cell {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: clamp(0.5rem, 1.5vw, 0.75rem);
}
.mini-cell.free { font-size: 0.5rem; font-weight: bold; background: var(--border); }
.mini-cell.marked { background: light-dark(#e7e7e7, #343434); color: light-dark(#666, #bbb); text-decoration: line-through; }

/* モーダル（拡大表示） */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 1000;
}
.modal[hidden] { display: none; }
.modal-content {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  width: min(100%, 600px);
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.close-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 12px;
  cursor: pointer;
  font-weight: 600;
}
.full-board {
  display: grid;
  gap: 5px;
}
.full-cell {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  font-size: clamp(0.8rem, 2.5vw, 1.2rem);
}
.full-cell.free { background: var(--surface); font-size: 0.75rem; font-weight: 700; }
.full-cell.marked {
  background: light-dark(#e7e7e7, #343434);
  color: light-dark(#666, #bbb);
  border-style: dashed;
}
.full-cell.marked span { text-decoration: line-through; }

#status { font-size: 0.85rem; color: #888; }
</style>
</head>
<body>
<main>
<header>
  <h1>ビンゴ ビューアー</h1>
  <span id="status">読み込み中...</span>
</header>

<!-- 画面上部：破られた数字の一覧 & 検索パネル -->
<section class="global-marked-panel">
  <div class="panel-top">
    <h3>破られている数字（タップでその数字を持つIDを検索）</h3>
    <div class="search-box">
      <input type="number" id="searchInput" placeholder="数字を入力" min="0">
      <button id="searchBtn" type="button">検索</button>
      <button id="clearSearchBtn" type="button" style="background:var(--surface); border:1px solid var(--border);">解除</button>
    </div>
  </div>
  <div id="markedNumbersList">
    <span style="color: #888; font-size: 0.85rem;">データがありません</span>
  </div>
</section>

<!-- カード一覧グリッド -->
<section id="cardsGrid" class="cards-grid">
  <!-- 動的生成 -->
</section>
</main>

<!-- 拡大モーダル -->
<div id="modal" class="modal" hidden>
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modalTitle" style="margin:0; font-size: 1.2rem;"></h2>
      <button id="closeModal" class="close-btn" type="button">閉じる</button>
    </div>
    <div id="modalBoard" class="full-board"></div>
  </div>
</div>

<script>
'use strict';

const statusEl = document.getElementById('status');
const cardsGrid = document.getElementById('cardsGrid');
const markedNumbersList = document.getElementById('markedNumbersList');
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const clearSearchBtn = document.getElementById('clearSearchBtn');

const modal = document.getElementById('modal');
const closeModalBtn = document.getElementById('closeModal');
const modalTitle = document.getElementById('modalTitle');
const modalBoard = document.getElementById('modalBoard');

let allData = {};
let currentModalId = null;
let selectedSearchNumber = null; // 検索で選択されている数字

// セルのインデックスから実際の数値を逆算
function getNumberFromIndex(n, values, index) {
  const hasFree = n % 2 === 1;
  const freeIndex = hasFree ? Math.floor((n * n) / 2) : -1;
  if (index === freeIndex) return 'FREE';
  const valIndex = index > freeIndex ? index - 1 : index;
  return values[valIndex];
}

// ビンゴ数計算
function calculateBingoCount(side, marked, hasFree) {
  let count = 0;
  const n = side;
  const freeIndex = hasFree ? Math.floor((n * n) / 2) : -1;

  function isMarked(idx) {
    if (idx === freeIndex) return true;
    return Array.isArray(marked) && marked.includes(idx);
  }

  for (let r = 0; r < n; r++) {
    let line = true;
    for (let c = 0; c < n; c++) {
      if (!isMarked(r * n + c)) { line = false; break; }
    }
    if (line) count++;
  }

  for (let c = 0; c < n; c++) {
    let line = true;
    for (let r = 0; r < n; r++) {
      if (!isMarked(r * n + c)) { line = false; break; }
    }
    if (line) count++;
  }

  let diag1 = true;
  for (let i = 0; i < n; i++) {
    if (!isMarked(i * n + i)) { diag1 = false; break; }
  }
  if (diag1) count++;

  let diag2 = true;
  for (let i = 0; i < n; i++) {
    if (!isMarked(i * n + (n - 1 - i))) { diag2 = false; break; }
  }
  if (diag2) count++;

  return count;
}

// データ取得
async function fetchAllData() {
  try {
    const res = await fetch('/api/get_all');
    if (!res.ok) throw new Error('Failed to fetch');
    allData = await res.json();
    renderAll();
    statusEl.textContent = `最終更新: ${new Date().toLocaleTimeString()} (自動更新中)`;
  } catch (err) {
    statusEl.textContent = 'データ取得エラー';
  }
}

// 全体描画
function renderAll() {
  cardsGrid.replaceChildren();
  
  const ids = Object.keys(allData).map(Number).sort((a, b) => a - b);
  
  if (ids.length === 0) {
    cardsGrid.innerHTML = '<p style="color:#888; grid-column: 1/-1;">有効なビンゴデータがありません。</p>';
    markedNumbersList.innerHTML = '<span style="color: #888; font-size: 0.85rem;">データがありません</span>';
    return;
  }

  const globalMarkedSet = new Set();
  const matchedIds = new Set();

  ids.forEach(id => {
    const data = allData[id];
    if (!data) return;

    const { side: n, values, marked } = data;
    const hasFree = n % 2 === 1;
    const cardMarkedNumbers = new Set();

    if (Array.isArray(marked)) {
      marked.forEach(idx => {
        const num = getNumberFromIndex(n, values, idx);
        if (num !== 'FREE') {
          globalMarkedSet.add(num);
          cardMarkedNumbers.add(num);
        }
      });
    }

    // 検索フィルター条件チェック
    let matchesSearch = true;
    if (selectedSearchNumber !== null) {
      matchesSearch = cardMarkedNumbers.has(selectedSearchNumber);
    }

    if (matchesSearch) {
      matchedIds.add(id);

      const bingoCount = calculateBingoCount(n, marked, hasFree);

      const card = document.createElement('div');
      card.className = 'card';
      card.addEventListener('click', () => openModal(id));

      const cardHeader = document.createElement('div');
      cardHeader.className = 'card-header';
      cardHeader.innerHTML = `
        <span>ID: ${id} (${n}×${n})</span>
        <span class="bingo-badge">ビンゴ: ${bingoCount}</span>
      `;
      card.appendChild(cardHeader);

      const miniBoard = document.createElement('div');
      miniBoard.className = 'mini-board';
      miniBoard.style.gridTemplateColumns = `repeat(${n}, minmax(0, 1fr))`;

      let valueIndex = 0;
      for (let i = 0; i < n * n; i++) {
        const isFree = hasFree && i === Math.floor((n * n) / 2);
        const miniCell = document.createElement('div');
        miniCell.className = 'mini-cell' + (isFree ? ' free' : '');

        if (isFree) {
          miniCell.textContent = 'F';
        } else {
          const val = values[valueIndex++];
          miniCell.textContent = val;
          if (Array.isArray(marked) && marked.includes(i)) {
            miniCell.classList.add('marked');
          }
        }
        miniBoard.appendChild(miniCell);
      }
      card.appendChild(miniBoard);
      cardsGrid.appendChild(card);
    }
  });

  if (cardsGrid.children.length === 0) {
    cardsGrid.innerHTML = `<p style="color:#888; grid-column: 1/-1;">数字「${selectedSearchNumber}」が破られているカードは見つかりませんでした。</p>`;
  }

  // 破られた数字の一覧チップ描画
  markedNumbersList.replaceChildren();
  if (globalMarkedSet.size === 0) {
    markedNumbersList.innerHTML = '<span style="color: #888; font-size: 0.85rem;">まだ破られた数字はありません</span>';
  } else {
    const sortedNums = Array.from(globalMarkedSet).sort((a, b) => a - b);
    sortedNums.forEach(num => {
      const chip = document.createElement('span');
      chip.className = 'marked-chip' + (selectedSearchNumber === num ? ' active' : '');
      chip.textContent = num;
      chip.addEventListener('click', () => {
        if (selectedSearchNumber === num) {
          clearSearch();
        } else {
          selectedSearchNumber = num;
          searchInput.value = num;
          renderAll();
        }
      });
      markedNumbersList.appendChild(chip);
    });
  }

  if (currentModalId !== null && allData[currentModalId]) {
    updateModalContent(allData[currentModalId]);
  }
}

// 検索実行
function executeSearch() {
  const val = searchInput.value.trim();
  if (val === '') {
    clearSearch();
    return;
  }
  selectedSearchNumber = Number.parseInt(val, 10);
  renderAll();
}

// 検索解除
function clearSearch() {
  selectedSearchNumber = null;
  searchInput.value = '';
  renderAll();
}

searchBtn.addEventListener('click', executeSearch);
clearSearchBtn.addEventListener('click', clearSearch);
searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') executeSearch();
});

// モーダル操作
function openModal(id) {
  currentModalId = id;
  const data = allData[id];
  if (!data) return;

  modalTitle.textContent = `ID: ${id} の詳細`;
  updateModalContent(data);
  modal.hidden = false;
}

function updateModalContent(data) {
  const { side: n, values, marked } = data;
  modalBoard.replaceChildren();
  modalBoard.style.gridTemplateColumns = `repeat(${n}, minmax(0, 1fr))`;

  const hasFree = n % 2 === 1;
  let valueIndex = 0;

  for (let i = 0; i < n * n; i++) {
    const isFree = hasFree && i === Math.floor((n * n) / 2);
    const cell = document.createElement('div');
    cell.className = 'full-cell' + (isFree ? ' free' : '');

    if (isFree) {
      cell.innerHTML = '<span>FREE</span>';
    } else {
      const val = values[valueIndex++];
      cell.innerHTML = `<span>${val}</span>`;
      if (Array.isArray(marked) && marked.includes(i)) {
        cell.classList.add('marked');
      }
    }
    modalBoard.appendChild(cell);
  }
}

closeModalBtn.addEventListener('click', () => {
  modal.hidden = true;
  currentModalId = null;
});

modal.addEventListener('click', (e) => {
  if (e.target === modal) {
    modal.hidden = true;
    currentModalId = null;
  }
});

// 初回取得 & ポーリング
fetchAllData();
setInterval(fetchAllData, 2000);
</script>
</body>
</html>
